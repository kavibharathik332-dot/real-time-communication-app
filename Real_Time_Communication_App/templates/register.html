{% extends "base.html" %}
{% block title %}Register - Real-Time Communication App{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">💬</div>
    <h1 class="auth-title">Create Your Account</h1>
    <p class="auth-subtitle">No phone number or email needed</p>

    <form method="POST" action="{{ url_for('main.register') }}" class="auth-form">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" value="{{ username or '' }}" placeholder="Choose a username" required autofocus minlength="3">

      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="Choose a password" required minlength="6">

      <label for="confirm_password">Confirm Password</label>
      <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your password" required minlength="6">

      <button type="submit" class="btn btn-primary">Register</button>
    </form>

    <p class="auth-switch">
      Already have an account? <a href="{{ url_for('main.login') }}">Login here</a>
    </p>
  </div>
</div>
{% endblock %}
